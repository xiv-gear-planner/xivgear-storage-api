plugins {
	id("java")
	id("io.micronaut.application")
	id("com.gradleup.shadow")
	id("io.micronaut.aot")
}

group = "gg.xp"
version = "1.0-SNAPSHOT"

repositories {
	mavenCentral()
}

dependencies {
	annotationProcessor("io.micronaut:micronaut-inject-java")
	annotationProcessor("io.micronaut.serde:micronaut-serde-processor")

	implementation("io.micronaut:micronaut-http-server-netty")
	implementation("io.micronaut.serde:micronaut-serde-jackson")
	implementation("com.fasterxml.jackson.core:jackson-databind")
	implementation("com.oracle.nosql.sdk:nosqldriver:5.4.14")
	implementation("io.micronaut.oraclecloud:micronaut-oraclecloud-common:5.0.1")
	implementation("org.apache.commons:commons-lang3:3.14.0")
	implementation("org.apache.commons:commons-text:1.11.0")
	implementation("org.jetbrains:annotations:24.1.0")
	implementation(project(":common-libs:logging"))

	runtimeOnly("ch.qos.logback:logback-classic")
	runtimeOnly("org.yaml:snakeyaml")

	testImplementation("io.micronaut:micronaut-http-client")
	testImplementation("org.hamcrest:hamcrest:2.2")
	testImplementation("org.junit.jupiter:junit-jupiter")
	testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

application {
	mainClass = "gg.xp.GearPlanServerMain"
	applicationDefaultJvmArgs = ["-XX:+UseCompactObjectHeaders"]
}

tasks.register("backup", JavaExec) {
	group = "application"
	description = "Run the Oracle NoSQL backup utility."
	dependsOn(tasks.named("classes"))
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "gg.xp.Backup"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

micronaut {
	runtime("netty")
	testRuntime("junit5")
	processing {
		incremental(true)
		annotations("gg.xp.*")
	}
	aot {
		optimizeServiceLoading = false
		convertYamlToJava = false
		precomputeOperations = true
		cacheEnvironment = true
		optimizeClassLoading = true
		deduceEnvironment = true
		optimizeNetty = true
		replaceLogbackXml = true
	}
	dockerfile {
		args("-XX:+UseCompactObjectHeaders")
		args("-XX:+UseG1GC")
		args("-XX:MinHeapFreeRatio=15")
		args("-XX:MaxHeapFreeRatio=30")
		args("-XX:MaxRAMPercentage=60")
		args("-XX:+UseStringDeduplication")
	}
}

tasks.named("dockerfile") {
	baseImage = "eclipse-temurin:25-jre"
}

tasks.withType(AbstractTestTask).configureEach {
	failOnNoDiscoveredTests = false
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	systemProperty("user.country", "US")
	systemProperty("user.language", "en")
	jvmArgs("-XX:+UseCompactObjectHeaders")
}
