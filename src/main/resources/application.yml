micronaut:
  application:
    name: xivgear-storage-api
  server:
    port: ${port:8080}
    cors:
      enabled: true
      configurations:
        all:
          allowed-origins-regex: ".*"
          allow-credentials: false

oracle-nosql:
  endpoint: "https://nosql.us-sanjose-1.oci.oraclecloud.com:443"
  table-name: "shortlinks"
  compartment-id: ${ORACLE_CLOUD_COMPARTMENT_ID}

oci:
  tenant-id: ${ORACLE_CLOUD_TENANT_ID}
  user-id: ${ORACLE_CLOUD_USER_ID}
  fingerprint: ${ORACLE_CLOUD_FINGERPRINT}
  private-key-file: file:${ORACLE_CLOUD_PEM_PATH}
  region: ${ORACLE_CLOUD_OBJECT_STORAGE_REGION:`us-sanjose-1`}


# Optional fallback database. Set ORACLE_NOSQL_SECONDARY_* to enable it.

gear-planner:
  backup:
    iterate-all-read-rate-percent: 25.0
    iterate-all-request-timeout-ms: 600000
  shortlink:
    max-upload-bytes: 50000
  cache:
    max-cache-size: 5000
    wakeup-interval: 10000
    worst-compress-ratio: 0.80
